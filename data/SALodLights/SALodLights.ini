[LodLights]
RenderLodLights = 1
MaxNumberOfLodLights = 25000
CoronaRadiusMultiplier = 0.5
SlightlyIncreaseRadiusWithDistance = 1
CoronaAlphaNearMinMult = 0.5             ; alpha multiplier for nearby coronas 
CoronaAlphaReachOneAt = 150.0            ; distance where alpha multiplier reaches 1.0
CoronaAlphaBoostStartAt = 150.0          ; start boosting after this
CoronaAlphaFarBoostMax = 4.0             ; max boost for distant coronas
CoronaFarClip = auto
MaxNumberOfDistantCars = 1000
MaritimeTraffic = 1                      ; 1 = distant boat lights on water paths, 0 = disabled
DistantCarsRadiusMultiplier = 1.0
DistantCars3D = 1
DistantBoats3D = 1
DistantCars3DLights = 1
DistantVehicleNightLightsOnly = 1       ; 1 = no daytime car/boat corona dots; smooth dawn/dusk fade

DistantVehicleProjectedLights = 1          ; Terrain-following road headlight patches at night; no boat road lights
DistantVehicleProjectedLightsDistance = 420.0  ; Only where GTA SA road collision is reliably streamed (160-580)
DistantVehicleProjectedLightsMaxCars = 8     ; Closest eligible distant cars per frame (0-24)
DistantVehicleProjectedLightsUpdatesPerFrame = 2 ; Max ground-probe rebuilds/frame (0-6, 20 queries each)
; Keep DistantCars3D=1 and DistantBoats3D=1 for daytime 3D silhouettes.
; Far road traffic uses low-poly bodies by day, corona impostors at night.
GpuDistantCars = 0                     ; GPU car transforms + cached-mesh hardware instancing (D3D9 VS3); 0 = classic RW
GpuLightQuads = 0                      ; D3D9 VS3 hardware-instanced distant-light quads; 0 = classic RW

; Zeneric GTA SA feature pass 8 (all opt-in; set 1 to enable)
; LOD transition assist prefetches eligible linked LOD assets ahead of their
; vanilla cutoff; it cannot force crossfade between the game's model meshes.
SeamlessLODTransitions = 1
LODTransitionDistance = 80.0
DistantVehicleVariety = 1                ; 4 stable compact/sedan/SUV/longbody silhouette proportions
SkyGFXWeatherIntegration = 1             ; native SA weather + camera fog; does not modify SkyGFX shaders
DynamicTrafficProfiles = 1
; Stable, spatially varied traffic: nonuniform neighborhood density and lane-aware gaps.
DistantTrafficClusterVariation = 0.85     ; 0 = original even distribution; 1 = strongest street-to-street contrast
DistantTrafficSpacingVariation = 0.90     ; 0 = original uniform circular spacing; 1 = varied per-lane headways
; SkyGFX Extended: fade traffic meshes AND sprites through native camera fog + weather haze.
DistantTrafficFogFade = 1                ; applies to classic RenderWare and optional GPU rendering
DistantTrafficHeavyFogDistance = 650.0   ; maximum sight range in dense GTA SA fog
DistantTrafficMaxVisibility = 1250.0     ; absolute traffic fade-out (0 = no extra distance cap)
RushHourTrafficMultiplier = 1.25
NightTrafficMultiplier = 0.65
DistanceBasedQuality = 1
TrafficHighDetailDistance = 350.0        ; full 3D near, simplified hull after this distance
TrafficMediumDetailDistance = 700.0      ; NIGHT: blend to light impostor; DAY: retain low-poly 3D body
TrafficDetailTransitionBand = 40.0      ; blend width for 3D -> sprite; no pop


[StaticShadows]
StaticShadowsIntensity = 2.0
StaticShadowsDrawDistance = 200.0

[SearchLights]
RenderSearchlightEffects = 1
RenderOnlyDuringFoggyWeather = 0
SearchlightEffectVisibilityFactor = 0.4

[FarClip]
FarClipMultiplier =  0.0                 ; 0.0 = dynamic, <= 10.0 = fixed multiplier (e.g. 5.0), > 10.0 = static farclip
HeightFactor = 0.05
MinMultiplier = 2.0
MaxMultiplier = 4.0
TargetFPS = 60
StaticSunSize = 20.0

[IDETweaker]
TimedObjectsDrawDistance = 0.0           ; 0 = off, >0 up to 10 = multiplier, >10 = absolute distance.
NeonsDrawDistance = 0.0                  ; Neon timed models only; overrides TimedObjectsDrawDistance for neon models.
LODObjectsDrawDistance = 1300.0       ; OBJS original >300 AND actual IsBigBuilding entities, including <=300 models.
BigBuildingsDrawDistance = 0.0        ; IsBigBuilding entities only; 0=off, <=10 multiplier, >10 min distance
AnimatedObjectsDrawDistance = 0.0     ; ANIM clump objects, separate from OBJS/TOBJ; 0=off
IncludeInteriorObjectsDrawDistance = 0 ; 1 = also apply normal/LOD/generic/veg distances to legacy excluded interior IDs
GenericObjectsDrawDistance = 300.0   ; Legacy IDs 615..1572 + generic/dynamic IDE files (including custom IDs).
AllNormalObjectsDrawDistance = 300.0 ; Extend all eligible OBJS IDs with original distance <=300, including non-generic/non-veg.
VegetationDrawDistance = 800.0        ; Legacy IDs 615..792 + vegetation IDE files and recognized tree/plant names.
; ModelDrawDistanceOverridesFile = data/SALodLights/model_draw_distance_overrides.csv  ; optional, uncomment to enable
PreloadLODs = 1                         ; linked LOD IDs; now shares total preload budget (no permanent pinning)
; GTA SA 1.0 US model preloading (0=off, 1=on). Separate from draw-distance options.
; Preloads asynchronously without permanently pinning models or manufacturing
; RwObjects. GTA may evict assets under memory pressure (intended).
; Settings below default OFF to avoid excessive memory usage/long load times.
PreloadNormalModels = 0                ; IDE models with original distance <=300; includes generic/vegetation
PreloadTimedModels = 0                 ; IDE timed models (including neons)
PreloadVegetationModels = 0            ; vegetation IDE/name classification plus legacy IDs
PreloadGenericModels = 0               ; generic/dynamic IDE classification plus legacy IDs
PreloadNeonModels = 0                  ; timed IDE models with "neon" in name
PreloadBigBuildingModels = 0           ; only IDs observed as CEntity::IsBigBuilding
PreloadAnimatedModels = 0              ; ANIM clumps with parsed draw-distance values
PreloadAllLODModels = 0                ; all OBJS entries with original IDE distance >300 (count-capped)
PreloadMaxModels = 128                ; hard cap 1024 across ALL categories including PreloadLODs
PreloadBatchSize = 8                  ; max asynchronous model requests per game tick
PreloadMemoryBudgetMB = 32           ; approximate incremental streaming RAM budget; 0 disables preloading
PreloadMinFreeMB = 24                  ; do not preload when the game's streaming budget has less free space
; Preloading is incremental after level load; the vanilla streamer owns eviction.
; The budget controls RAM estimates, not exact GPU VRAM usage. Changes need game restart.

